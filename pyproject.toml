[project]
name = "epsi-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "e-psi-lon" }
]
dependencies = [
    "aiocache[memcached]>=0.12.3",
    "aiodns>=4.0.4",
    "aiomultiprocess>=0.9.1",
    "audioop-lts>=0.2.2",
    "charset-normalizer>=3.5.2",
    "davey>=0.1.7",
    "psutil>=7.2.2",
    "py-cord>=2.8.1",
    "pydantic>=2.14.1",
    "pynacl>=1.6.2",
    "python-dotenv>=1.2.4",
    "python-ffmpeg>=2.0.12",
    "pytubefix>=11.2.0",
    "quart>=0.23.1",
    "quart-session>=3.0.0",
    "tortoise-orm[asyncpg]>=1.1.9",
]


[project.scripts]
epsi-bot = "epsi_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.extra-build-dependencies]
"quart-session" = ["setuptools"]

[tool.hatch.build]
include = ["epsi_bot/**"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "types-psutil>=7.2.2.20260906",
    "pytest>=9.1.1",
    "pytest-aio>=2.1.7",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "ruff>=0.17.0",
    "pre-commit>=4.7.0",
]


[tool.ruff.format]
indent-style = "tab"
